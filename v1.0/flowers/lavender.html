<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lavender</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    body { overflow: hidden; }

    .flower-stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
    }

    /* Multiple lavender stalks */
    .lavender-group {
      display: flex;
      align-items: flex-end;
      gap: clamp(8px, 3vw, 20px);
      padding-bottom: 60px;
      animation: groupSway 8s ease-in-out infinite;
    }
    @keyframes groupSway {
      0%,100% { transform: rotate(-2deg); }
      50%      { transform: rotate(2deg) translateY(-6px); }
    }

    .lav-stalk {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .lav-spike {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 4px;
    }

    .lav-floret {
      width: clamp(14px, 4vw, 22px);
      height: clamp(7px, 2vw, 11px);
      border-radius: 50%;
      background: linear-gradient(135deg, #c0a0e0, #8060b8);
      box-shadow: 0 1px 4px rgba(100,60,160,0.3);
      animation: floretIn 0.5s var(--ease-gentle) both;
      position: relative;
    }
    .lav-floret::after {
      content: '';
      position: absolute;
      inset: 20% 25%;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
    }
    @keyframes floretIn {
      from { transform: scale(0); opacity: 0; }
    }

    .lav-stem {
      width: clamp(3px, 1vw, 5px);
      border-radius: 3px;
      background: linear-gradient(to bottom, #6aaa68, #4a7a48);
    }

    .lav-leaf {
      position: absolute;
      width: clamp(12px, 3.5vw, 20px);
      height: clamp(6px, 1.5vw, 9px);
      background: linear-gradient(135deg, #78b870, #508850);
      border-radius: 50%;
      transform-origin: right center;
    }

    /* Floating scent particles */
    .scent-particle {
      position: fixed;
      pointer-events: none;
      font-size: 0.9rem;
      opacity: 0;
      animation: scentFloat linear infinite;
    }
    @keyframes scentFloat {
      0%   { transform: translateY(0) scale(0.5); opacity: 0; }
      20%  { opacity: 0.6; transform: translateY(-15vh) scale(1); }
      100% { transform: translateY(-60vh) scale(0.3); opacity: 0; }
    }

    .info-panel {
      position: fixed;
      bottom: clamp(1rem, 4vw, 2rem);
      left: 50%;
      transform: translateX(-50%);
      width: min(560px, calc(100vw - 3rem));
      z-index: 10;
      padding: 1.4rem 1.8rem;
      text-align: center;
      animation: panelUp 0.8s 1.5s var(--ease-gentle) both;
    }
    @keyframes panelUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }
    .info-panel .fact { font-size: clamp(0.9rem, 2vw, 1.05rem); opacity: 0.65; font-style: italic; margin-bottom: 0.5rem; }
    .info-panel .note { font-family: var(--font-display); font-size: clamp(1.1rem, 3vw, 1.5rem); }
  </style>
</head>
<body>
  <canvas class="stars" id="stars"></canvas>
  <a href="../index.html" class="btn back-btn">← Garden</a>

  <div class="flower-stage">
    <div class="lavender-group" data-repel id="lav-group"></div>
  </div>

  <div class="info-panel card">
    <p class="fact" id="fun-fact"></p>
    <p class="note" id="personal-note"></p>
  </div>

  <aside class="env-toggle">
    <label for="env-time">Time</label>
    <select id="env-time"><option value="morning">🌅 Morning</option><option value="sunset">🌇 Sunset</option><option value="night">🌙 Night</option></select>
    <label for="env-weather">Weather</label>
    <select id="env-weather"><option value="sunny">☀️ Sunny</option><option value="rainy">🌧 Rainy</option><option value="foggy">🌫 Foggy</option></select>
    <label for="env-season">Season</label>
    <select id="env-season"><option value="spring">🌸 Spring</option><option value="summer">🌻 Summer</option><option value="autumn">🍂 Autumn</option><option value="winter">❄️ Winter</option></select>
  </aside>

  <script src="../config.js"></script>
  <script src="../flower-base.js"></script>
  <script src="../interaction.js"></script>
  <script>
    renderFlowerMeta('lavender');
    initEnvToggle();

    // Build lavender stalks dynamically
    const group = document.getElementById('lav-group');
    const stalks = [
      { florets: 10, stemH: 160, delay: 0 },
      { florets: 14, stemH: 200, delay: 0.1 },
      { florets: 12, stemH: 180, delay: 0.05 },
      { florets: 9,  stemH: 155, delay: 0.15 },
      { florets: 13, stemH: 190, delay: 0.08 },
    ];
    stalks.forEach((s, si) => {
      const div = document.createElement('div');
      div.className = 'lav-stalk';

      const spike = document.createElement('div');
      spike.className = 'lav-spike';
      for (let i = 0; i < s.florets; i++) {
        const f = document.createElement('div');
        f.className = 'lav-floret';
        f.style.animationDelay = (s.delay + i * 0.04) + 's';
        const w = 100 - (i / s.florets) * 40;
        f.style.width = w + '%';
        f.style.alignSelf = 'center';
        spike.appendChild(f);
      }
      div.appendChild(spike);

      const stem = document.createElement('div');
      stem.className = 'lav-stem';
      stem.style.height = s.stemH + 'px';

      // Add leaves
      for (let j = 0; j < 3; j++) {
        const leaf = document.createElement('div');
        leaf.className = 'lav-leaf';
        leaf.style.top = (20 + j * 30) + 'px';
        leaf.style.left = j % 2 === 0 ? '-18px' : 'auto';
        leaf.style.right = j % 2 !== 0 ? '-18px' : 'auto';
        leaf.style.transform = j % 2 === 0 ? 'rotate(140deg)' : 'rotate(40deg)';
        stem.appendChild(leaf);
      }

      div.appendChild(stem);
      group.appendChild(div);
    });

    // Scent particles
    for (let i = 0; i < 6; i++) {
      const p = document.createElement('div');
      p.className = 'scent-particle';
      p.setAttribute('data-repel', '');
      p.textContent = '✦';
      p.style.color = '#b89fd4';
      p.style.left = (30 + Math.random() * 40) + 'vw';
      p.style.bottom = '30vh';
      p.style.animationDuration = (4 + Math.random() * 5) + 's';
      p.style.animationDelay = (Math.random() * 6) + 's';
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
