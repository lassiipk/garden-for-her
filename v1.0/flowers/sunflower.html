<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunflower</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    body { overflow: hidden; background: linear-gradient(180deg, #7ec8e3 0%, #ffe4a0 100%); }
    body.env-morning  { background: linear-gradient(180deg, #aacde8 0%, #fce8d0 100%); }
    body.env-sunset   { background: linear-gradient(180deg, #e8895a 0%, #f5c8a0 100%); }
    body.env-night    { background: linear-gradient(180deg, #1a1a3e 0%, #2d2060 100%); }

    .flower-stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .sunflower-wrap {
      position: relative;
      width: clamp(200px, 38vmin, 340px);
      height: clamp(200px, 38vmin, 340px);
      animation: sunSway 5s ease-in-out infinite;
    }
    @keyframes sunSway {
      0%,100% { transform: rotate(-2deg); }
      50%      { transform: rotate(2deg) translateY(-8px); }
    }

    /* 16 petals */
    .sf-petal {
      position: absolute;
      width: 25%;
      height: 45%;
      border-radius: 50%;
      background: linear-gradient(to bottom, #ffe060, #f5a820);
      transform-origin: 50% 100%;
      left: 37.5%;
      top: 5%;
      animation: petalBloom 1s var(--ease-gentle) both;
    }
    @keyframes petalBloom {
      from { transform: var(--rot) scaleY(0); opacity: 0; }
      to   { transform: var(--rot) scaleY(1); opacity: 1; }
    }
    .sf-petal:nth-child(1)  { --rot: rotate(0deg);      animation-delay: .05s; }
    .sf-petal:nth-child(2)  { --rot: rotate(22.5deg);   animation-delay: .10s; }
    .sf-petal:nth-child(3)  { --rot: rotate(45deg);     animation-delay: .15s; }
    .sf-petal:nth-child(4)  { --rot: rotate(67.5deg);   animation-delay: .20s; }
    .sf-petal:nth-child(5)  { --rot: rotate(90deg);     animation-delay: .25s; }
    .sf-petal:nth-child(6)  { --rot: rotate(112.5deg);  animation-delay: .30s; }
    .sf-petal:nth-child(7)  { --rot: rotate(135deg);    animation-delay: .35s; }
    .sf-petal:nth-child(8)  { --rot: rotate(157.5deg);  animation-delay: .40s; }
    .sf-petal:nth-child(9)  { --rot: rotate(180deg);    animation-delay: .45s; }
    .sf-petal:nth-child(10) { --rot: rotate(202.5deg);  animation-delay: .50s; }
    .sf-petal:nth-child(11) { --rot: rotate(225deg);    animation-delay: .55s; }
    .sf-petal:nth-child(12) { --rot: rotate(247.5deg);  animation-delay: .60s; }
    .sf-petal:nth-child(13) { --rot: rotate(270deg);    animation-delay: .65s; }
    .sf-petal:nth-child(14) { --rot: rotate(292.5deg);  animation-delay: .70s; }
    .sf-petal:nth-child(15) { --rot: rotate(315deg);    animation-delay: .75s; }
    .sf-petal:nth-child(16) { --rot: rotate(337.5deg);  animation-delay: .80s; }

    .sf-disc {
      position: absolute;
      inset: 25%;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #7a4a18, #3a1c04);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      animation: discIn 1.2s 0.9s var(--ease-gentle) both;
    }
    @keyframes discIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    /* Seed pattern */
    .sf-disc::after {
      content: '';
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #5a3810, #2a1004);
      opacity: 0.7;
    }

    .sf-stem {
      position: absolute;
      bottom: -100px;
      left: 50%;
      width: 10px;
      height: 110px;
      background: linear-gradient(to bottom, #5a9a40, #3a7a28);
      border-radius: 5px;
      transform: translateX(-50%);
      animation: stemGrow 1s 0.3s var(--ease-gentle) both;
    }
    @keyframes stemGrow {
      from { height: 0; }
      to   { height: 110px; }
    }
    .sf-leaf {
      position: absolute;
      width: 38px;
      height: 24px;
      background: linear-gradient(135deg, #6aaa50, #4a8a38);
      border-radius: 0 50% 50% 0;
    }
    .sf-leaf-l { top: 15px; right: 6px; transform: rotate(-40deg) scaleX(-1); }
    .sf-leaf-r { top: 50px; left: 6px;  transform: rotate(40deg); }

    .sunbeam {
      position: fixed;
      top: -10%;
      left: 50%;
      width: 3px;
      height: 60vh;
      background: linear-gradient(to bottom, rgba(255,220,80,0.5), transparent);
      transform-origin: top center;
      pointer-events: none;
      animation: beamSpin 12s linear infinite;
      opacity: 0.4;
    }
    @keyframes beamSpin { to { transform: rotate(360deg); } }

    .info-panel {
      position: fixed;
      bottom: clamp(1rem, 4vw, 2rem);
      left: 50%;
      transform: translateX(-50%);
      width: min(560px, calc(100vw - 3rem));
      z-index: 10;
      padding: 1.4rem 1.8rem;
      text-align: center;
      animation: panelUp 0.8s 1.4s var(--ease-gentle) both;
    }
    @keyframes panelUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }
    .info-panel .fact { font-size: clamp(0.9rem, 2vw, 1.05rem); opacity: 0.65; font-style: italic; margin-bottom: 0.5rem; }
    .info-panel .note { font-family: var(--font-display); font-size: clamp(1.1rem, 3vw, 1.5rem); }
  </style>
</head>
<body>
  <canvas class="stars" id="stars"></canvas>
  <a href="../index.html" class="btn back-btn">← Garden</a>

  <!-- Sunbeams -->
  <div class="sunbeam" style="transform:rotate(0deg)"></div>
  <div class="sunbeam" style="transform:rotate(30deg);animation-delay:-2s"></div>
  <div class="sunbeam" style="transform:rotate(60deg);animation-delay:-4s"></div>
  <div class="sunbeam" style="transform:rotate(90deg);animation-delay:-6s"></div>
  <div class="sunbeam" style="transform:rotate(120deg);animation-delay:-8s"></div>
  <div class="sunbeam" style="transform:rotate(150deg);animation-delay:-10s"></div>

  <div class="flower-stage">
    <div class="sunflower-wrap" data-repel>
      <div class="sf-petal"></div><div class="sf-petal"></div><div class="sf-petal"></div>
      <div class="sf-petal"></div><div class="sf-petal"></div><div class="sf-petal"></div>
      <div class="sf-petal"></div><div class="sf-petal"></div><div class="sf-petal"></div>
      <div class="sf-petal"></div><div class="sf-petal"></div><div class="sf-petal"></div>
      <div class="sf-petal"></div><div class="sf-petal"></div><div class="sf-petal"></div>
      <div class="sf-petal"></div>
      <div class="sf-disc"></div>
      <div class="sf-stem">
        <div class="sf-leaf sf-leaf-l"></div>
        <div class="sf-leaf sf-leaf-r"></div>
      </div>
    </div>
  </div>

  <div class="info-panel card">
    <p class="fact" id="fun-fact"></p>
    <p class="note" id="personal-note"></p>
  </div>

  <aside class="env-toggle">
    <label for="env-time">Time</label>
    <select id="env-time"><option value="morning">🌅 Morning</option><option value="sunset">🌇 Sunset</option><option value="night">🌙 Night</option></select>
    <label for="env-weather">Weather</label>
    <select id="env-weather"><option value="sunny">☀️ Sunny</option><option value="rainy">🌧 Rainy</option><option value="foggy">🌫 Foggy</option></select>
    <label for="env-season">Season</label>
    <select id="env-season"><option value="spring">🌸 Spring</option><option value="summer">🌻 Summer</option><option value="autumn">🍂 Autumn</option><option value="winter">❄️ Winter</option></select>
  </aside>

  <script src="../config.js"></script>
  <script src="../flower-base.js"></script>
  <script src="../interaction.js"></script>
  <script>
    renderFlowerMeta('sunflower');
    initEnvToggle();
  </script>
</body>
</html>
